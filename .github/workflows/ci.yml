name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix frontend
      - run: npm test
      - run: npm run build
      - run: docker build --tag seadex-companion:ci .
      - name: Smoke test container
        run: |
          docker run --detach --name seadex-companion-ci --publish 18080:8080 seadex-companion:ci
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --header 'X-Smoke-Test: 1' --dump-header /tmp/headers http://127.0.0.1:18080/healthz | grep --quiet '"status":"ok"'; then
              grep --ignore-case --quiet '^x-content-type-options: nosniff' /tmp/headers
              grep --ignore-case --quiet '^content-security-policy:' /tmp/headers
              exit 0
            fi
            sleep 1
          done
          docker logs seadex-companion-ci
          exit 1
      - name: Scan runtime image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: seadex-companion:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: hiranaka/seadex-companion:latest
          provenance: mode=max
          sbom: true
