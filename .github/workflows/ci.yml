name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix frontend
      - run: npm test
      - run: npm run build
      - run: docker build --tag seadex-companion:ci .
      - name: Smoke test container
        run: |
          docker run --detach --name seadex-companion-ci --publish 18080:8080 seadex-companion:ci
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/healthz; then exit 0; fi
            sleep 1
          done
          docker logs seadex-companion-ci
          exit 1
      - name: Scan runtime image
        uses: docker/scout-action@v1
        with:
          command: cves
          image: local://seadex-companion:ci
          only-severities: critical,high
          exit-code: true
