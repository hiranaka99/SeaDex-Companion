name: Publish Docker image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build (for example v1.10.0)'
        required: true
        type: string
      prerelease:
        description: 'Publish as a prerelease (do not update latest)'
        default: false
        type: boolean

permissions:
  contents: read

# Serialize publishing so concurrent builds cannot race to update latest.
concurrency:
  group: docker-release
  cancel-in-progress: false

env:
  IMAGE_NAME: hiranaka/seadex-companion

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check registry credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo '::error::Add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN under repository Settings > Secrets and variables > Actions.'
            exit 1
          fi

      - name: Check out the released version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - name: Validate release and package versions
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          IS_PRERELEASE: ${{ github.event.release.prerelease || inputs.prerelease || false }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs'
          const tag = process.env.RELEASE_TAG || ''
          const version = tag.replace(/^v/, '')
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$/.test(version)) {
            throw new Error('Release tag must be a version such as v1.10.0 or v1.11.0-rc.1')
          }
          for (const path of ['package.json', 'frontend/package.json']) {
            if (JSON.parse(readFileSync(path, 'utf8')).version !== version) {
              throw new Error(`${path} version must match the release tag ${tag}`)
            }
          }
          const stable = process.env.IS_PRERELEASE !== 'true' && !version.includes('-')
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\nstable=${stable}\n`)
          NODE

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Test the released source
        run: |
          npm ci
          npm test

      - name: Set up ARM emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.stable == 'true' }}
            type=raw,value=latest,enable=${{ steps.version.outputs.stable == 'true' }}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write publication summary
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf 'Published Docker images:\n\n```text\n%s\n```\n\nDigest: `%s`\n' "$IMAGE_TAGS" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
