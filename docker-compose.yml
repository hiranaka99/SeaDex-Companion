services:
  seadex-compare:
    build: .
    container_name: seadex-compare
    # Port mapping is "host:container".
    #   - The CONTAINER side (right of the colon) must match the PORT env var
    #     below — that is the port the app listens on inside the container.
    #   - The HOST side (left of the colon) is the port you browse to.
    # Example: to serve on http://<host>:8878 with the app also on 8878 inside,
    # use "8878:8878" here and set PORT=8878 below.
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    # Secrets are supplied from a local, git-ignored .env file (see .env.example).
    # Docker Compose reads ./.env automatically and substitutes the ${VAR} values
    # below at startup. Never put real secrets in this file.
    environment:
      # Internal (container) port the app listens on. Must match the right-hand
      # side of the ports mapping above. Default 8080.
      - PORT=8080
      - DATA_DIR=/app/data
      - SONARR_URL=${SONARR_URL}
      - SONARR_KEY=${SONARR_KEY}
      - RADARR_URL=${RADARR_URL}
      - RADARR_KEY=${RADARR_KEY}
      - QBITTORRENT_URL=${QBITTORRENT_URL}
      - QBITTORRENT_USER=${QBITTORRENT_USER}
      - QBITTORRENT_PASS=${QBITTORRENT_PASS}
      - DISCORD_WEBHOOK=${DISCORD_WEBHOOK}
    restart: unless-stopped